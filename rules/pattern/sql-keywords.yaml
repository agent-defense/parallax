# SQL injection — keyword pattern rules
# Loaded by the `sql-keywords` evaluator (see config.yaml).
# Stages: message.before, tool.before.

- id: sql-001
  title: SQL destructive keywords
  description: Detects common SQL injection and destructive query patterns
  keywords:
    - "DROP TABLE"
    - "DROP DATABASE"
    - "DELETE FROM"
    - "TRUNCATE TABLE"
    - "'; --"
    - "1=1"
  action: detect
  priority: medium
