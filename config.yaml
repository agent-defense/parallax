# Parallax Security Configuration
# ================================
# Full configuration referencing the rule library under ./rules/.
# For a minimal inline starter, see parallax.yaml.
#
# Sections:
#   server     — HTTP server bind address
#   proxy      — Upstream LLM provider for proxy mode
#   reporting  — Audit log and webhook configuration
#   evaluators — Security evaluators; each declares stages and where its
#                rules live (rules_file, rules_dir, or inline rules)

server:
  host: "127.0.0.1"
  port: 9920

# Proxy mode upstream configuration.
# Used when running: parallax serve --mode proxy -c config.yaml
# Supported providers: anthropic (default), openai, gemini, custom
proxy:
  provider: anthropic
  # Uncomment to override the default upstream URL:
  # upstream_url: https://api.openai.com

reporting:
  log_file: ./logs/audit.jsonl
  # Uncomment to enable webhook reporting to SIEM, Slack, or PagerDuty:
  # webhook_url: https://your-siem.example.com/webhook
  # webhook_events: [block, redact]

evaluators:
  # ── Regex: Secret Scanner ──────────────────────────────────────
  - name: secrets-scanner
    type: regex
    stages: [tool.before, tool.after]
    rules_file: ./rules/regex/secrets.yaml

  # ── Regex: PII Scanner ─────────────────────────────────────────
  - name: pii-scanner
    type: regex
    stages: [tool.after]
    rules_file: ./rules/regex/pii.yaml

  # ── Regex: Data Exfiltration ───────────────────────────────────
  - name: data-exfiltration
    type: regex
    stages: [tool.before, tool.after]
    rules_file: ./rules/regex/data-exfiltration.yaml

  # ── Regex: Dangerous Commands ──────────────────────────────────
  - name: dangerous-commands
    type: regex
    stages: [tool.before]
    rules_file: ./rules/regex/dangerous-commands.yaml

  # ── Pattern: SQL Injection Keywords ────────────────────────────
  - name: sql-keywords
    type: pattern
    stages: [message.before, tool.before]
    rules_file: ./rules/pattern/sql-keywords.yaml

  # ── Pattern: Supply Chain ──────────────────────────────────────
  - name: supply-chain
    type: pattern
    stages: [tool.before]
    rules_file: ./rules/pattern/supply-chain.yaml

  # ── Sigma: Threat Detection ────────────────────────────────────
  # Auto-loads every *.yaml file in the directory (multi-document Sigma format).
  # Covers: dangerous tools, prompt injection, reconnaissance, shadow IT.
  - name: sigma-threats
    type: sigma
    stages: [message.before, tool.before, tool.after]
    rules_dir: ./rules/sigma

  # ── CEL: General Policies ──────────────────────────────────────
  - name: cel-policies
    type: cel
    stages: [tool.before]
    rules_file: ./rules/cel/policies.yaml

  # ── CEL: Privilege Escalation ──────────────────────────────────
  - name: cel-privilege-escalation
    type: cel
    stages: [tool.before]
    rules_file: ./rules/cel/privilege-escalation.yaml

  # ── CEL: Model Manipulation ────────────────────────────────────
  - name: cel-model-manipulation
    type: cel
    stages: [tool.before]
    rules_file: ./rules/cel/model-manipulation.yaml

  # ── SQL: Rate Limits & Aggregates ──────────────────────────────
  - name: rate-limits
    type: sql
    stages: [tool.before, tool.after]
    rules_file: ./rules/sql/rate-limits.yaml
